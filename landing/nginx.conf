server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Preserve old app links, including their query strings.
    location ~ ^/(dashboard|login|invite|reset-password|vivienda|materials|planos|notas|inspiracion|presupuestos|facturas|settings|tareas|gastos|proveedores|calendario|progreso)(/|$) {
        return 302 https://app-reforma.noxumlab.com$request_uri;
    }

    location /api/ {
        return 307 https://app-reforma.noxumlab.com$request_uri;
    }

    location = /sw.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
